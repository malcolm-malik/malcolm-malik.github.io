<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malcolm Malik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">Malcolm Malik</h1>
    <nav class="site-nav">
      <a href="now.html">Now</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects & Work</a>
      <a href="contact.html">Contact</a>
    </nav>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
      Dark mode
    </button>
  </header>

  <main class="home-content page-content">
    <div class="video">
      <iframe src="https://www.youtube.com/embed/XS1dOhUFvRk" title="YouTube video" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="video">
      <iframe src="https://www.youtube.com/embed/lbpqQxYlXAk" title="YouTube video" frameborder="0" allowfullscreen></iframe>
    </div>
  </main>

  <script>
    const toggle = document.getElementById("theme-toggle");

    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
      toggle.textContent = "Light mode";
    }

    toggle.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");

      if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("theme", "dark");
        toggle.textContent = "Light mode";
      } else {
        localStorage.setItem("theme", "light");
        toggle.textContent = "Dark mode";
      }
    });
  </script>

</body>
</html>
