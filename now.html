<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now — Malcolm Malik</title>
  <link rel="stylesheet" href="style.css">
</head>
<script>
  const toggle = document.getElementById("theme-toggle");

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
    toggle.textContent = "Light mode";
  }

  toggle.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
      localStorage.setItem("theme", "dark");
      toggle.textContent = "Light mode";
    } else {
      localStorage.setItem("theme", "light");
      toggle.textContent = "Dark mode";
    }
  });
</script>
<body>

  <header class="site-header">
    <h1 class="site-title">Malcolm Malik</h1>

    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="now.html">Now</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects & Work</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
  Dark mode
    </button>
  </header>

  <main class="page-content now-page">
    <h2>Now</h2>
    <div id="now-content"></div>
  </main>

  <script>
    fetch("/now.json")
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById("now-content");

        data.items.forEach(item => {
          if (item.type === "text") {
            const p = document.createElement("p");
            p.innerHTML = item.html || item.content;
            container.appendChild(p);
          }

          if (item.type === "link") {
            const p = document.createElement("p");
            const a = document.createElement("a");
            a.href = item.url;
            a.textContent = item.text;
            a.target = "_blank";
            a.rel = "noopener";
            p.appendChild(a);
            container.appendChild(p);
          }

          if (item.type === "image") {
            const img = document.createElement("img");
            img.src = item.src;
            img.alt = item.alt || "";
            img.className = "now-image";
            container.appendChild(img);
          }

          if (item.type === "youtube") {
            const videoId =
              item.url.split("v=")[1]?.split("&")[0] ||
              item.url.split("/").pop();

            const wrapper = document.createElement("div");
            wrapper.className = "now-video";

            wrapper.innerHTML = `
              <iframe
                src="https://www.youtube.com/embed/${videoId}"
                title="YouTube video"
                frameborder="0"
                allowfullscreen>
              </iframe>
            `;

            container.appendChild(wrapper);
          }
        });
      });
  </script>

</body>
</html>
